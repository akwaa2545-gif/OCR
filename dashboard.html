
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OTD System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css" />
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            padding: var(--space-4);
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -25%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        body::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(30, 64, 175, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .login-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            width: 100%;
            max-width: 440px;
            padding: var(--space-10);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }
        
        .login-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-4);
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.3);
        }
        
        .login-logo i {
            font-size: 2.25rem;
            color: var(--white);
        }
        
        .login-title {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: var(--space-2);
            letter-spacing: -0.02em;
        }
        
        .login-subtitle {
            color: var(--gray-600);
            font-size: var(--font-size-base);
            font-weight: 500;
        }
        
        .login-form .form-group {
            margin-bottom: var(--space-5);
        }
        
        .login-form .form-label {
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: var(--space-2);
            font-size: var(--font-size-sm);
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        
        .login-btn {
            width: 100%;
            padding: var(--space-4);
            font-size: var(--font-size-base);
            font-weight: 700;
            margin-top: var(--space-2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .login-footer {
            text-align: center;
            margin-top: var(--space-6);
            padding-top: var(--space-4);
            border-top: 1px solid var(--gray-200);
        }
        
        .login-datetime {
            font-size: var(--font-size-xs);
            color: var(--gray-500);
            font-weight: 500;
        }
        
        .login-datetime span {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <img src="/images/otd-logo-minimal.svg" alt="OTD logo" style="width:56px;height:56px;display:block;margin:0 auto;border-radius:6px;">
            </div>
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Operator's Training Database</p>
        </div>


        <form method="post" class="login-form" data-validate>
            <div class="form-group">
                <label for="username" class="form-label">Employee ID</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-person input-icon"></i>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter your employee ID" required autocomplete="username" data-val="true" data-val-required="The Username field is required." value="">
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" data-val="true" data-val-required="The Password field is required.">
                </div>
            </div>

            <button type="submit" class="btn btn-primary login-btn">
                <i class="bi bi-box-arrow-in-right"></i>
                Sign In
            </button>
        <input name="__RequestVerificationToken" type="hidden" value="CfDJ8GCoCln_5-lEnRNveXdZu1DLLRFASgkRND8EoENTMvtYKFNEnXmQlUrhzwzwA_odkNZ1ChQRdVy-OErs-oEdqrTWZZkTO9jraqTMO3dGIhtaCqkRF6C8PnxA2PEm7mp0JylcztcVlztChyfBTlnpl-w" /></form>

        <div class="login-footer">
            <div class="login-datetime">
                <span id="date">Tuesday, 17 February 2026</span>
                <span id="time">15:32:10</span>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function updateTime() {
            const now = new Date();
            const timeEl = document.getElementById('time');
            if (timeEl) {
                timeEl.textContent = now.toLocaleTimeString('en-GB', { hour12: false });
            }
        }
        setInterval(updateTime, 1000);
        
        // Focus on first input
        document.getElementById('username')?.focus();
    </script>
</body>
</html>
