name: OCR build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Environment to deploy (main branch only)
        type: choice
        required: true
        default: test
        options: [test, prod]

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test web application (no production database access)
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: dotnet test tests/OperatorCertificationRecord.Web.Tests/OperatorCertificationRecord.Web.Tests.csproj --configuration Release --logger "trx;LogFileName=results.trx"

  deployment-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline deployment and workflow regression checks
        run: |
          $ErrorActionPreference = 'Stop'
          & ./deploy/test-Deploy-Ocr.ps1
          & ./deploy/test-Isolate-TestStorage.ps1
          & ./deploy/test-Workflow.ps1
          & ./deploy/test-RegistryLogin.ps1
          & ./deploy/test-PublishSafety.ps1
          & ./deploy/test-HostConfig.ps1
          & ./deploy/test-RunnerTask.ps1

  publish:
    needs: [web-tests, deployment-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and publish immutable Linux image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/ocr-registry.XXXXXX")"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          image="ghcr.io/${REPOSITORY,,}/ocr-web"
          metadata="$RUNNER_TEMP/ocr-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          docker buildx build --platform linux/amd64 --push --tag "$image:$COMMIT_SHA" --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" --label "org.opencontainers.image.revision=$COMMIT_SHA" --metadata-file "$metadata" .
          digest="$(jq -er '.["containerimage.digest"]' "$metadata")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "Published: $image@$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'prod' && 'production' || 'test' }}
    concurrency:
      group: ocr-host-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pull, validate, deploy and roll back on failed readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
          DOCKER_HOST: npipe:////./pipe/dockerDesktopLinuxEngine
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'prod' && 'prod' || 'test' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'THBTCDT-CM1XKG2') { throw 'Deployment job reached an unexpected host.' }
          if ($env:DEPLOY_IMAGE -notmatch '^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$') { throw 'Invalid immutable image reference.' }
          . ./deploy/RegistryLogin.ps1
          $registryConfig = $null
          $deploymentFailed = $false
          try {
            Remove-Item Env:DOCKER_AUTH_CONFIG -ErrorAction SilentlyContinue
            $registryConfig = New-OcrRegistryConfig -Root 'C:\ocr-deploy' -Actor $env:GH_ACTOR -Token $env:GH_TOKEN
            $env:DOCKER_CONFIG = $registryConfig
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            & ./deploy/Deploy-Ocr.ps1 -Environment $env:DEPLOY_TARGET -Image $env:DEPLOY_IMAGE -ConfigRoot 'C:\ocr-deploy'
          } catch {
            $deploymentFailed = $true
            throw
          } finally {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            Remove-Item Env:DOCKER_CONFIG -ErrorAction SilentlyContinue
            Remove-Item Env:DOCKER_AUTH_CONFIG -ErrorAction SilentlyContinue
            try {
              if ($null -ne $registryConfig) { Remove-OcrRegistryConfig -Root 'C:\ocr-deploy' -Path $registryConfig }
            } catch {
              Write-Warning 'Private registry credential cleanup failed; inspect the restricted OCR deployment directory.'
              if (-not $deploymentFailed) { throw 'Registry credential cleanup failed.' }
            }
          }
          exit 0
