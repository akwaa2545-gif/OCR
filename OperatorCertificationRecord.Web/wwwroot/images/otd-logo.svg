<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="OTD logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FF9446"/>
      <stop offset="100%" stop-color="#FF6A1A"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
  </defs>

  <!-- rounded badge background -->
  <rect x="4" y="4" width="192" height="192" rx="28" fill="url(#g)" />

  <!-- stylized pen icon (reference-inspired) -->
  <g transform="translate(26,20) rotate(-20 40 40)">
    <!-- pen body -->
    <path d="M12 28 C30 14, 66 14, 84 28 L76 40 C60 30, 36 30, 20 40 Z" fill="url(#penGrad)" opacity="0.98" />
    <!-- pen tip (nib) -->
    <path d="M84 28 L96 40 L84 52 L76 40 Z" fill="#111827" />
    <path d="M88 40 L92 36" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- OTD wordmark -->
  <g font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="800" fill="#ffffff">
    <text x="38" y="128" font-size="56">OTD</text>
    <text x="38" y="152" font-size="12">Operator Training</text>
  </g>

  <!-- white badge + orange check to the right of D -->
  <g transform="translate(136,118)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <path d="M-5,0 L-1,5 L6,-4" stroke="#FF6A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

</svg>