<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="OTD pencil logo">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="18" fill="url(#g1)" />
  <!-- pencil body -->
  <g transform="translate(22,24) rotate(-25 38 38)">
    <rect x="18" y="8" width="44" height="16" rx="2" fill="#fff" opacity="0.95"/>
    <rect x="18" y="8" width="36" height="16" rx="2" fill="#fffbeb" />
    <!-- tip -->
    <path d="M62 8 L68 16 L62 24 L56 16 Z" fill="#111827" />
    <path d="M56 11 L58 16 L56 21" fill="#6b7280" opacity="0.35"/>
    <!-- ferrule -->
    <rect x="50" y="8" width="6" height="16" fill="#f59e0b" />
    <!-- lead -->
    <rect x="64" y="13" width="2" height="6" rx="1" fill="#374151" />
  </g>
  <!-- OTD text small -->
  <g font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" fill="#ffffff">
    <text x="18" y="95" font-size="18">OTD</text>
    <text x="18" y="110" font-size="8">Operator Cert.</text>
  </g>
</svg>