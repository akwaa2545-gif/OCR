<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="OTD pen logo">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>

  <!-- background badge -->
  <rect width="120" height="120" rx="18" fill="url(#g1)" />

  <!-- subtle shadow under pen -->
  <ellipse cx="60" cy="82" rx="34" ry="6" fill="#000" opacity="0.08" />

  <!-- pen body (angled) -->
  <g transform="translate(20,18) rotate(-18 40 40)">
    <!-- main body -->
    <rect x="8" y="14" width="64" height="18" rx="6" fill="#ffffff" />
    <!-- inner panel for contrast -->
    <rect x="18" y="16" width="44" height="14" rx="4" fill="#f8fafc" />

    <!-- ferrule / collar -->
    <rect x="66" y="12" width="8" height="22" rx="3" fill="url(#metal)" />
    <rect x="66" y="12" width="8" height="22" rx="3" fill="#ffffff" opacity="0.08" />

    <!-- nib body (stylized) -->
    <path d="M74 15 L94 30 L74 45 L70 30 Z" fill="#ffffff" />
    <!-- nib tip split and hole -->
    <path d="M78 28 L86 30 L78 32" stroke="#111827" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="82" cy="30" r="2.6" fill="#111827" />

    <!-- subtle shading on nib -->
    <path d="M74 15 L82 30 L74 45" fill="#000" opacity="0.06" />
  </g>

  <!-- OTD wordmark and tagline -->
  <g font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" fill="#ffffff">
    <text x="18" y="95" font-size="18">OTD</text>
    <text x="18" y="110" font-size="8">Operator Training</text>
  </g>

  <!-- white badge + orange check (to right of D) -->
  <g transform="translate(64,88)">
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <path d="M-2.5,0 L-1,1.8 L2.5,-1.8" stroke="#FF8C42" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>