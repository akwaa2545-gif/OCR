<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="OTD team logo (orange)">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff9e43"/>
      <stop offset="100%" stop-color="#fb7a16"/>
    </linearGradient>
  </defs>

  <!-- rounded square background (orange theme) -->
  <rect width="120" height="120" rx="18" fill="url(#bg)" />

  <!-- gear with wrench (white for contrast) -->
  <g transform="translate(60,26)" fill="#ffffff">
    <circle cx="0" cy="0" r="12" fill="#ffffff" />
    <path d="M-18-2 L-22-6 L-20-12 L-14-10 L-12-6 L-8-8 L-4-4 L-8 0 L4 12 L10 8 L14 10 L20 6 L22 12 L18 14 L12 12 L6 16 L2 12 L-4 16 L-8 12 L-12 14 L-18 8 Z" opacity="0.06"/>
    <rect x="4" y="-6" width="18" height="6" rx="1" fill="#ffb86b" transform="rotate(35) translate(4,0)"/>
  </g>

  <!-- three people silhouettes (dark navy for contrast) -->
  <g fill="#071834">
    <ellipse cx="36" cy="80" rx="12" ry="8" opacity="0.12"/>
    <ellipse cx="60" cy="84" rx="14" ry="9" opacity="0.14"/>
    <ellipse cx="84" cy="80" rx="12" ry="8" opacity="0.12"/>

    <circle cx="36" cy="68" r="8" />
    <path d="M28 80c0-6 8-10 16-10s16 4 16 10v8H28v-8z" opacity="0.98"/>

    <circle cx="60" cy="64" r="10" />
    <path d="M48 82c0-7 12-12 24-12s24 5 24 12v10H48v-10z" opacity="0.98"/>

    <circle cx="84" cy="68" r="8" />
    <path d="M76 80c0-6 8-10 16-10s16 4 16 10v8H76v-8z" opacity="0.98"/>
  </g>

  <!-- small OTD text -->
  <g font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" fill="#071834">
    <text x="60" y="110" font-size="10" text-anchor="middle">OTD System</text>
  </g>
</svg>