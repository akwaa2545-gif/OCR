<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="OTD logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF5A1F"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect x="4" y="4" width="112" height="112" rx="20" ry="20" fill="url(#g)"/>

  <!-- subtle white stroke -->
  <rect x="6" y="6" width="108" height="108" rx="18" ry="18" fill="none" stroke="#ffffff22" stroke-width="2" />

  <!-- stylized pencil (minimal) -->
  <g transform="translate(18,20) scale(0.7)" fill="#fff">
    <rect x="40" y="44" width="26" height="8" rx="2" ry="2" fill="#ffffffcc" transform="rotate(-24 53 48)" />
    <polygon points="68,28 80,40 64,56 52,44" fill="#fff"/>
    <polygon points="64,56 56,64 44,52 52,44" fill="#ffffffdd"/>
  </g>

  <!-- OTD letters -->
  <text x="60" y="78" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="32" fill="#ffffff">OTD</text>
</svg>
